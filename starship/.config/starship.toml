# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = '$directory$git_branch$git_status$character'
add_newline = false
scan_timeout = 10

[character] 
success_symbol = '[❯](bold green)'

[package]
disabled = true

[battery]
disabled = true

[cmd_duration]
disabled = true

[git_branch]
disabled = false

[git_status]
disabled = false
